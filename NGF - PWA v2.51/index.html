<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08070f">
<meta name="description" content="الروابط الاجتماعية لمنصة NGF - تابعني على يوتيوب، تويتش، تويتر، إنستغرام والمزيد">
<title>NGF | الروابط الاجتماعية</title>

<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NGF">
<meta name="mobile-web-app-capable" content="yes">

<style>
/* =========================================================
   NGF — Social Links Page
   Design tokens
   ========================================================= */
:root{
  --bg-0:#08070f;
  --bg-1:#0d0c1a;
  --violet:#8b5cf6;
  --violet-soft:#a78bfa;
  --cyan:#22d3ee;
  --text-hi:#f3f1fb;
  --text-mid:#b8b4c9;
  --text-low:#716d85;
  --glass:rgba(255,255,255,0.055);
  --glass-strong:rgba(255,255,255,0.09);
  --stroke:rgba(255,255,255,0.09);
  --stroke-hover:rgba(255,255,255,0.22);
  --radius:20px;
  --ease:cubic-bezier(.22,1,.36,1);
}

*{box-sizing:border-box;}

html{scroll-behavior:smooth;}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(ellipse 60% 40% at 50% -10%, rgba(139,92,246,0.16), transparent 60%),
    var(--bg-0);
  color:var(--text-hi);
  font-family:'Tajawal','Cairo',sans-serif;
  direction:rtl;
  overflow-x:hidden;
  position:relative;
}

/* ---------- animated background canvas ---------- */
#bg-canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
  pointer-events:none;
}

.aurora{
  position:fixed;
  border-radius:50%;
  filter:blur(70px);
  opacity:0.35;
  z-index:0;
  pointer-events:none;
  will-change:transform;
}
.aurora--a{
  width:520px;height:520px;
  top:-160px; left:-120px;
  background:radial-gradient(circle, var(--violet), transparent 70%);
  animation:drift-a 22s ease-in-out infinite;
}
.aurora--b{
  width:460px;height:460px;
  bottom:-180px; right:-140px;
  background:radial-gradient(circle, var(--cyan), transparent 70%);
  animation:drift-b 26s ease-in-out infinite;
}
@keyframes drift-a{
  0%,100%{transform:translate(0,0) scale(1);}
  50%{transform:translate(60px,40px) scale(1.15);}
}
@keyframes drift-b{
  0%,100%{transform:translate(0,0) scale(1);}
  50%{transform:translate(-50px,-30px) scale(1.1);}
}

/* ---------- layout ---------- */
.page{
  position:relative;
  z-index:1;
  max-width:460px;
  margin:0 auto;
  padding:64px 22px 40px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* ---------- avatar ---------- */
.avatar-wrap{
  position:relative;
  width:112px;
  height:112px;
  margin-bottom:22px;
  opacity:0;
  animation:rise .7s var(--ease) forwards;
}
.avatar-ring{
  position:absolute;
  inset:-8px;
  border-radius:50%;
  background:conic-gradient(from 0deg, var(--violet), var(--cyan), var(--violet));
  animation:spin 6s linear infinite;
  filter:blur(1px);
}
.avatar-ring::after{
  content:"";
  position:absolute;
  inset:3px;
  border-radius:50%;
  background:var(--bg-0);
}
.avatar{
  position:relative;
  width:100%;
  height:100%;
  border-radius:50%;
  overflow:hidden;
  z-index:1;
  background:var(--bg-1);
  display:flex;
  align-items:center;
  justify-content:center;
}
.avatar img{
  width:100%;
  height:100%;
  object-fit:contain;
  padding:20px;
  box-sizing:border-box;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- header text ---------- */
.title{
  font-family:'Cairo',sans-serif;
  font-weight:800;
  font-size:26px;
  margin:0 0 6px;
  background:linear-gradient(90deg, var(--text-hi), var(--violet-soft) 60%, var(--cyan));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  opacity:0;
  animation:rise .7s var(--ease) forwards;
  animation-delay:.08s;
  text-align:center;
}
.subtitle{
  color:var(--text-mid);
  font-size:15px;
  margin:0 0 30px;
  opacity:0;
  animation:rise .7s var(--ease) forwards;
  animation-delay:.16s;
  text-align:center;
}
.typewriter{
  display:inline-block;
  border-left:2px solid var(--violet-soft);
  padding-left:3px;
}

@keyframes rise{
  from{opacity:0; transform:translateY(14px);}
  to{opacity:1; transform:translateY(0);}
}

/* ---------- links list ---------- */
.links{
  width:100%;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.link-card{
  --card-x:50%;
  --card-y:50%;
  position:relative;
  display:flex;
  align-items:center;
  gap:14px;
  width:100%;
  padding:14px 16px;
  border-radius:var(--radius);
  background:var(--glass);
  border:1px solid var(--stroke);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  text-decoration:none;
  color:var(--text-hi);
  overflow:hidden;
  cursor:pointer;
  opacity:0;
  transform:translateY(16px);
  animation:rise .6s var(--ease) forwards;
  transition:border-color .35s var(--ease), transform .35s var(--ease), background .35s var(--ease), box-shadow .35s var(--ease);
}
.link-card::before{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(220px circle at var(--card-x) var(--card-y), rgba(139,92,246,0.22), transparent 60%);
  opacity:0;
  transition:opacity .35s var(--ease);
  pointer-events:none;
}
.link-card:hover{
  border-color:var(--stroke-hover);
  background:var(--glass-strong);
  transform:translateY(-3px);
  box-shadow:0 14px 30px -14px rgba(139,92,246,0.35);
}
.link-card:hover::before{opacity:1;}
.link-card:active{transform:translateY(-1px) scale(.985);}

.link-card:focus-visible{
  outline:2px solid var(--cyan);
  outline-offset:3px;
}

.icon-wrap{
  position:relative;
  z-index:1;
  flex:none;
  width:44px;
  height:44px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,0.05);
  border:1px solid var(--stroke);
}
.icon-wrap svg{width:22px; height:22px; fill:var(--text-hi);}

.link-body{
  position:relative;
  z-index:1;
  flex:1;
  min-width:0;
}
.link-name{
  font-weight:700;
  font-size:15.5px;
  margin:0;
}
.link-handle{
  font-size:12.5px;
  color:var(--text-low);
  margin:2px 0 0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.link-go{
  position:relative;
  z-index:1;
  flex:none;
  width:18px;
  height:18px;
  color:var(--text-low);
  transition:transform .35s var(--ease), color .35s var(--ease);
}
.link-card:hover .link-go{
  transform:translateX(-4px);
  color:var(--cyan);
}

/* ripple */
.ripple{
  position:absolute;
  border-radius:50%;
  background:rgba(255,255,255,0.35);
  transform:scale(0);
  animation:ripple .6s ease-out forwards;
  pointer-events:none;
}
@keyframes ripple{
  to{transform:scale(1); opacity:0;}
}

/* ---------- stats / footer ---------- */
.footer{
  margin-top:34px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
  opacity:0;
  animation:rise .7s var(--ease) forwards;
  animation-delay:.5s;
}

.share-btn{
  display:flex;
  align-items:center;
  gap:8px;
  background:transparent;
  border:1px solid var(--stroke);
  color:var(--text-mid);
  font-family:inherit;
  font-size:13px;
  padding:9px 16px;
  border-radius:999px;
  cursor:pointer;
  transition:all .3s var(--ease);
}
.share-btn:hover{
  border-color:var(--stroke-hover);
  color:var(--text-hi);
  background:var(--glass);
}
.share-btn svg{width:14px;height:14px;}
.share-btn.copied{
  border-color:var(--cyan);
  color:var(--cyan);
}

.made-by{
  font-size:12px;
  color:var(--text-low);
  letter-spacing:.02em;
}
.made-by b{
  color:var(--text-mid);
  font-weight:700;
}

/* reduced motion */
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;}
  .avatar-ring{animation:none;}
}

@media (max-width:380px){
  .title{font-size:22px;}
  .link-name{font-size:14.5px;}
}

</style>
</head>

    `;

    card.addEventListener('mousemove', e => {
      const r = card.getBoundingClientRect();
      card.style.setProperty('--card-x', `${e.clientX - r.left}px`);
      card.style.setProperty('--card-y', `${e.clientY - r.top}px`);
    });

    card.addEventListener('click', e => {
      const r = card.getBoundingClientRect();
      const ripple = document.createElement('span');
      const size = Math.max(r.width, r.height) * 1.6;
      ripple.className = 'ripple';
      ripple.style.width = ripple.style.height = `${size}px`;
      ripple.style.left = `${e.clientX - r.left - size / 2}px`;
      ripple.style.top = `${e.clientY - r.top - size / 2}px`;
      card.appendChild(ripple);
      ripple.addEventListener('animationend', () => ripple.remove());
    });

    frag.appendChild(card);
  });

  container.appendChild(frag);
}

/* ---------- typewriter subtitle ---------- */
function typewriter(){
  const el = document.getElementById('typewriter');
  const text = 'تابعني على جميع المنصات';
  let i = 0;
  const speed = 55;
  (function tick(){
    if (i <= text.length){
      el.textContent = text.slice(0, i);
      i++;
      setTimeout(tick, speed);
    } else {
      el.style.borderLeft = 'none';
    }
  })();
}

/* ---------- copy link button ---------- */
function initShareButton(){
  const btn = document.getElementById('share-btn');
  const label = document.getElementById('share-label');
  btn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(window.location.href);
    } catch (err) {
      const ta = document.createElement('textarea');
      ta.value = window.location.href;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    btn.classList.add('copied');
    label.textContent = 'تم النسخ!';
    setTimeout(() => {
      btn.classList.remove('copied');
      label.textContent = 'نسخ رابط الصفحة';
    }, 1800);
  });
}

/* ---------- ambient particle field ---------- */
function initParticles(){
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let w, h, particles;
  const COUNT = 46;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }

  function makeParticles(){
    particles = Array.from({ length: COUNT }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 1.6 + 0.4,
      vx: (Math.random() - 0.5) * 0.15,
      vy: (Math.random() - 0.5) * 0.15,
      a: Math.random() * 0.5 + 0.15
    }));
  }

  function step(){
    ctx.clearRect(0, 0, w, h);
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0) p.x = w;
      if (p.x > w) p.x = 0;
      if (p.y < 0) p.y = h;
      if (p.y > h) p.y = 0;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(167,139,250,${p.a})`;
      ctx.fill();
    });
    if (!reduceMotion) requestAnimationFrame(step);
  }

  resize();
  makeParticles();
  window.addEventListener('resize', () => { resize(); makeParticles(); });
  step();
}

/* ---------- PWA: service worker + install prompt ---------- */
function initPWA(){
  if ('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

  const installBtn = document.getElementById('install-btn');
  let deferredPrompt = null;

  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.hidden = false;
  });

  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBtn.hidden = true;
  });

  window.addEventListener('appinstalled', () => {
    installBtn.hidden = true;
  });
}

document.addEventListener('DOMContentLoaded', () => {
  renderLinks();
  typewriter();
  initShareButton();
  initParticles();
  initPWA();
});
